engineStrict: true

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@1.3.0'

overrides:
  vite: 'npm:@voidzero-dev/vite-plus-core@1.4.0'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

updateConfig:
  ignoreDependencies:
    # `svelte-kit sync` needs the JS API that TypeScript 7 dropped; `@typescript/native` carries 7
    - typescript
